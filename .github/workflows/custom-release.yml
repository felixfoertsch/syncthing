name: custom release

permissions:
  contents: read

# Every trigger updates the same branches and release tags. Never cancel a publisher.
concurrency:
  group: custom-release
  cancel-in-progress: false

on:
  push:
    branches:
      - patch-queue
    paths:
      - ".github/workflows/**"
      - "patches/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Optional upstream Syncthing tag, for example v2.1.3"
        required: false
      suffix:
        description: "Optional custom release suffix, for example 2026.10.08.1"
        required: false
  schedule:
    - cron: "17 04 * * *"

jobs:
  build:
    if: github.repository == 'felixfoertsch/syncthing' && github.ref == 'refs/heads/patch-queue'
    permissions:
      contents: read
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check exact control
        run: test "$(git rev-parse HEAD)" = "$CONTROL"
        env:
          CONTROL: ${{ github.sha }}
      - name: Test control
        run: |
          python3 scripts/tests/test-custom-release.py
          python3 scripts/tests/test-publisher.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build unsigned candidate
        run: bash scripts/build-candidate.sh
        env:
          CONTROL: ${{ github.sha }}
          CHANNEL: ${{ matrix.channel }}
          CUSTOM_RELEASE_UPSTREAM_TAG: ${{ matrix.channel == 'stable' && github.event.inputs.upstream_tag || '' }}
          CUSTOM_RELEASE_SUFFIX: ${{ github.event.inputs.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.channel }}
          path: candidate/
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'felixfoertsch/syncthing' && github.ref == 'refs/heads/patch-queue'
    permissions:
      contents: write
    runs-on: macos-14
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [stable, nightly]
    env:
      CUSTOM_RELEASE_CHANNEL: ${{ matrix.channel }}
      CUSTOM_RELEASE_AUTOMATION_REF: ${{ github.sha }}
      CUSTOM_RELEASE_EXPLICIT_TAG: ${{ github.event.inputs.upstream_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.channel }}
          path: candidate
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify candidate against trusted reconstruction
        id: verify
        run: bash scripts/verify-source.sh
        env:
          CONTROL: ${{ github.sha }}
          CHANNEL: ${{ matrix.channel }}
      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/syncthing-release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          previous_default_keychain="$(security default-keychain -d user 2>/dev/null | sed 's/[ "]//g' || true)"

          echo "::add-mask::$keychain_password"
          echo "CUSTOM_RELEASE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "CUSTOM_RELEASE_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          echo "CUSTOM_RELEASE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "CUSTOM_RELEASE_PREVIOUS_DEFAULT_KEYCHAIN=$previous_default_keychain" >> "$GITHUB_ENV"

          if [ -z "$DEVELOPER_ID_APPLICATION_P12_BASE64" ]; then
            echo "DEVELOPER_ID_APPLICATION_P12_BASE64 secret is required" >&2
            exit 1
          fi
          if [ -z "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" ]; then
            echo "DEVELOPER_ID_APPLICATION_P12_PASSWORD secret is required" >&2
            exit 1
          fi

          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identity_output"
          codesign_identity="$(printf '%s\n' "$identity_output" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$codesign_identity" ]; then
            echo "Developer ID Application signing identity is required in DEVELOPER_ID_APPLICATION_P12_BASE64" >&2
            exit 1
          fi

          probe_binary="$RUNNER_TEMP/codesign-probe"
          cp /usr/bin/true "$probe_binary"
          codesign --force --dryrun --sign "$codesign_identity" --keychain "$keychain_path" --options runtime --timestamp "$probe_binary"
          echo "CUSTOM_RELEASE_CODESIGN_IDENTITY=$codesign_identity" >> "$GITHUB_ENV"
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}

      - name: Sign verified archive without executing candidate
        run: python3 scripts/verify-candidate.py candidate "$CUSTOM_RELEASE_AUTOMATION_REF" "$CUSTOM_RELEASE_CHANNEL" sign
      - name: Publish verified source refs
        run: bash scripts/publish-source.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          response="$RUNNER_TEMP/release-state.json"
          RELEASE_EXISTS=false
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$response"; then
            RELEASE_EXISTS=true
          elif ! jq -e '.status == "404" or .status == 404' "$response" >/dev/null; then
            exit 1
          fi
          bash scripts/check-freshness.sh
          assets=()
          for asset in candidate/*; do
            [ -f "$asset" ] || continue
            case "$(basename "$asset")" in release-notes.md|candidate.json|source.bundle) continue ;; esac
            assets+=("$asset")
          done
          [[ ${#assets[@]} -gt 1 && -s candidate/SHA256SUMS && -s candidate/release-notes.md ]] || {
            echo "Release artifacts are missing for $tag" >&2
            exit 1
          }
          (cd candidate && shasum -a 256 -c SHA256SUMS)
          if [[ "$RELEASE_EXISTS" == true ]]; then
            # Never overwrite an already published release, even if another host won.
            if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != true ]]; then
              python3 scripts/verify-release.py candidate "$tag"
              echo "Published source and assets verified: $tag"
              exit 0
            fi
          else
            channel_args=()
            if [[ "${CUSTOM_RELEASE_CHANNEL:-stable}" == nightly ]]; then
              channel_args=(--prerelease --latest=false)
            fi
            gh release create "$tag" --draft --title "$tag" --notes-file candidate/release-notes.md --verify-tag ${channel_args[@]+"${channel_args[@]}"}
          fi
          # A retry may fill gaps, never replace bytes already attached to a draft.
          if [[ "$RELEASE_EXISTS" == true ]]; then
            existing="$RUNNER_TEMP/existing-release-assets"
            mkdir -p "$existing"
            names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            pending=()
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if printf '%s\n' "$names" | grep -Fxq "$name"; then
                gh release download "$tag" --pattern "$name" --dir "$existing"
                cmp "$asset" "$existing/$name" || { echo "Draft asset differs: $name" >&2; exit 1; }
              else
                pending+=("$asset")
              fi
            done
            assets=(${pending[@]+"${pending[@]}"})
          fi
          [[ ${#assets[@]} == 0 ]] || gh release upload "$tag" "${assets[@]}"
          python3 scripts/verify-release.py candidate "$tag"
          bash scripts/check-freshness.sh
          if [[ "$CUSTOM_RELEASE_CHANNEL" == nightly ]]; then
            gh release edit "$tag" --notes-file candidate/release-notes.md --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --notes-file candidate/release-notes.md --draft=false --prerelease=false --latest
          fi
          python3 scripts/verify-release.py candidate "$tag"
        env:
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_EXISTS: false
          GH_TOKEN: ${{ github.token }}

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${CUSTOM_RELEASE_PREVIOUS_DEFAULT_KEYCHAIN:-}" ] && [ -e "$CUSTOM_RELEASE_PREVIOUS_DEFAULT_KEYCHAIN" ]; then
            security default-keychain -d user -s "$CUSTOM_RELEASE_PREVIOUS_DEFAULT_KEYCHAIN" || true
          fi
          if [ -n "${CUSTOM_RELEASE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$CUSTOM_RELEASE_KEYCHAIN_PATH" || true
          fi
          if [ -n "${CUSTOM_RELEASE_CERTIFICATE_PATH:-}" ]; then
            rm -f "$CUSTOM_RELEASE_CERTIFICATE_PATH"
          fi
